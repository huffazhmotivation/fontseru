  <body>
    <div id="root"></div>
    <div id="ds-recover" role="alert">
      <div>
        <h1 style="margin:0 0 8px;font-size:20px">DesignSeru belum tampil</h1>
        <p style="margin:0 0 8px;opacity:.75">Aplikasi tidak selesai dimuat. Ini bisa terjadi setelah aplikasi ditutup paksa atau koneksi lemah. Proyekmu tidak dihapus.</p>
        <button class="primary" id="ds-reload">Muat ulang</button>
        <button id="ds-reset">Bersihkan cache aplikasi &amp; muat ulang</button>
      </div>
    </div>
    <script>
      // jaring pengaman layar putih: bila setelah 10 dtk #root masih kosong, tampilkan tombol pemulihan
      (function () {
        var box = document.getElementById('ds-recover');
        function ok() { var r = document.getElementById('root'); return r && r.childElementCount > 0; }
        function check() { if (!ok()) { box.className = 'show'; var i = setInterval(function () { if (ok()) { box.className = ''; clearInterval(i); } }, 1000); } }
        var t = setTimeout(check, 10000);
        window.addEventListener('error', function (e) { if (e && e.target && e.target.tagName === 'SCRIPT') { clearTimeout(t); setTimeout(check, 1500); } }, true);
        document.getElementById('ds-reload').onclick = function () { location.reload(); };
        document.getElementById('ds-reset').onclick = function () {
          var jobs = [];
          try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
          try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        };
      })();
    </script>
