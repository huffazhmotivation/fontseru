<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>FontSeru — Promo 30s</title>
<style>
  :root {
    --lime: #c6f24e;
    --lime2: #7fd13b;
    --pink: #ff4da6;
    --purple: #9b6cff;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; height: 100vh; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Inter, sans-serif;
    color: #f5f5f7; transform-origin: 0 0;
  }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity, filter; }
  .full { width: 100%; height: 100%; }
  .center { left: 50%; top: 50%; }
  #bg { position: absolute; inset: 0; }
  .h {
    position: absolute; left: 0; width: 100%; text-align: center; font-weight: 700;
    letter-spacing: -0.035em; line-height: 1.02; white-space: nowrap;
  }
  .h .w { display: inline-block; will-change: transform, opacity, filter; }
  .grad-lime { background: linear-gradient(100deg, #e9ff9a 0%, var(--lime) 40%, #5fcf6a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grad-pink { background: linear-gradient(100deg, #ffb3d9, var(--pink) 50%, #ff7a59); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grad-purple { background: linear-gradient(100deg, #d7c6ff, var(--purple) 55%, #5b7bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grad-tri { background: linear-gradient(95deg, var(--lime) 0%, #8fe3a0 25%, var(--pink) 55%, var(--purple) 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-weight: 500; color: #a1a1a6; letter-spacing: -0.01em; }

  .screen {
    position: absolute; border-radius: 18px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.13), 0 40px 120px rgba(0,0,0,.75), 0 0 140px rgba(198,242,78,.07);
    background: #0b0b0b;
  }
  .screen img { display: block; width: 100%; height: 100%; }
  .screen .layer { position: absolute; inset: 0; }
  .persp { perspective: 2200px; perspective-origin: 50% 40%; }

  .ipad {
    position: absolute; background: #111; border-radius: 54px; padding: 26px;
    box-shadow: 0 0 0 2px #2a2a2c, 0 0 0 4px #0a0a0a, 0 50px 140px rgba(0,0,0,.8);
  }
  .ipad .glass { border-radius: 30px; overflow: hidden; width: 100%; height: 100%; position: relative; }
  .ipad img { width: 100%; height: 100%; display: block; }

  .chip {
    position: absolute; padding: 18px 34px; border-radius: 999px; font-weight: 700; font-size: 38px;
    letter-spacing: -0.02em; color: #0b0d0c; background: var(--lime);
    box-shadow: 0 20px 60px rgba(198,242,78,.25);
  }
  .tablabel { position: absolute; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; text-align: center; width: 400px; }
  .ring { position: absolute; border: 3px solid var(--lime); border-radius: 50%; }
  #controls { position: fixed; left: 16px; bottom: 12px; right: 16px; display: flex; gap: 12px; align-items: center; font: 13px -apple-system, sans-serif; color: #aaa; z-index: 9; }
  #controls input { flex: 1; }
  #controls button { background: #222; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  body.render #controls { display: none; }
  body.render { display: block; height: auto; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>

  <!-- S1: intro -->
  <div id="intro-sm" class="h sub" style="top: 500px; font-size: 40px;">Memperkenalkan</div>
  <svg id="bigS" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#eaff9e" />
        <stop offset=".5" stop-color="#c6f24e" />
        <stop offset="1" stop-color="#4fbf5c" />
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="26" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <g id="sG" filter="url(#glow)">
      <path id="sStroke" fill="none" stroke="#c6f24e" stroke-width="5" stroke-linejoin="round" />
      <path id="sFill" fill="url(#gl)" />
    </g>
  </svg>
  <div id="intro-name" class="h" style="top: 870px; font-size: 64px;">FontSeru</div>

  <!-- screens -->
  <div id="persp" class="abs full persp">
    <div id="scrA" class="screen"><img src="shots/font-select.png" /><img class="layer" id="scrA2" src="shots/font-node.png" /></div>
    <div id="scrB" class="screen"><img src="shots/font-multi.png" /></div>
    <div id="scrC" class="screen"><img src="shots/testlab-pangram.png" /></div>
    <div id="card0" class="screen"><img src="shots/font-node.png" /></div>
    <div id="card1" class="screen"><img src="shots/design-1.png" /></div>
    <div id="card2" class="screen"><img src="shots/motion-play.png" /></div>
    <div id="ipad" class="ipad"><div class="glass"><img src="shots/tablet.png" /><div id="ipadRing" class="ring"></div></div></div>
    <div id="scrE" class="screen"><img src="shots/export.png" /></div>
  </div>
  <!-- headlines -->
  <div id="h2" class="h" style="top: 70px; font-size: 84px;"></div>
  <div id="h3" class="h" style="top: 70px; font-size: 84px;"></div>
  <div id="h4" class="h" style="top: 70px; font-size: 84px;"></div>
  <div id="h5" class="h" style="top: 70px; font-size: 84px;"></div>
  <div id="h6" class="h" style="top: 70px; font-size: 84px;"></div>
  <div id="h7" class="h" style="top: 70px; font-size: 84px;"></div>
  <div id="h8" class="h" style="top: 70px; font-size: 84px;"></div>

  <div id="lab0" class="tablabel grad-lime">Font</div>
  <div id="lab1" class="tablabel grad-pink">Design</div>
  <div id="lab2" class="tablabel grad-purple">Motion</div>
  <div id="chips"></div>

  <!-- end card -->
  <div id="end" class="abs full">
    <img id="endIcon" src="icon.svg" class="abs" style="width: 210px; height: 210px; left: 855px; top: 250px; border-radius: 48px;" />
    <img id="endWord" src="logo-dark.png" class="abs" style="width: 520px; left: 700px; top: 500px;" />
    <div id="endTag" class="h" style="top: 690px; font-size: 64px;">Buat font-mu <span class="grad-lime">sendiri.</span></div>
    <div id="endSub" class="h sub" style="top: 800px; font-size: 32px;">Web · macOS · Windows · iPad</div>
  </div>
  <div id="fade" class="abs full" style="background:#000; opacity:0;"></div>
</div>

<div id="controls"><button id="play">⏯</button><input id="scrub" type="range" min="0" max="30" step="0.01" value="0" /><span id="tc">0.00</span></div>

<script>
const DUR = 30;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));          // expo out
const eInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const eIn = (p) => p * p * p;
const eBack = (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
/** fade in over [a,a+fi], fade out over [b-fo,b] */
const win = (t, a, b, fi = 0.5, fo = 0.5) => Math.min(eOut(seg(t, a, a + fi)), 1 - eIn(seg(t, b - fo, b)));
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };

/* ---------- headlines: each word rises with blur, Apple keynote style ---------- */
const HEAD = {
  h2: [['Desain huruf.', ''], ['Langsung di browser.', 'grad-lime']],
  h3: [['Setiap kurva.', ''], ['Setiap titik.', 'grad-lime']],
  h4: [['Ratusan glyph.', ''], ['Satu kanvas.', 'grad-lime']],
  h5: [['Uji setiap', ''], ['kata.', 'grad-lime']],
  h6: [['Satu aplikasi.', ''], ['Tiga studio.', 'grad-tri']],
  h7: [['Kini juga di', ''], ['iPad.', 'grad-lime']],
  h8: [['Ekspor ke', ''], ['format standar.', 'grad-lime']],
};
for (const id in HEAD) {
  $(id).innerHTML = HEAD[id].map(([txt, cls]) => txt.split(' ').map((w) => `<span class="w ${cls}">${w}</span>`).join(' ')).join(' ');
}
function headline(id, t, a, b) {
  const el = $(id);
  const vis = t > a - 0.05 && t < b + 0.05;
  el.style.display = vis ? '' : 'none';
  if (!vis) return;
  const words = el.querySelectorAll('.w');
  words.forEach((w, i) => {
    const p = eOut(seg(t, a + i * 0.09, a + i * 0.09 + 0.9));
    const q = eIn(seg(t, b - 0.45, b));
    css(w, {
      opacity: String(p * (1 - q)),
      transform: `translateY(${(1 - p) * 60 - q * 30}px)`,
      filter: `blur(${(1 - p) * 18 + q * 12}px)`,
    });
  });
}

/* ---------- screen helper ---------- */
const SW = 1440, SH = 900;
const SY = 665, SWD = 1300; // 16:10 like the captures
function place(el, { x = 960, y = SY, w = SWD, s = 1, rx = 0, ry = 0, rz = 0, tz = 0, o = 1, blur = 0, ox = 50, oy = 50 }) {
  const h = (w * SH) / SW;
  css(el, {
    width: w + 'px', height: h + 'px', left: x - w / 2 + 'px', top: y - h / 2 + 'px',
    transform: `translateZ(${tz}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`,
    transformOrigin: `${ox}% ${oy}%`,
    opacity: String(o), filter: blur ? `blur(${blur}px)` : 'none', display: o <= 0.001 ? 'none' : '',
  });
}
/** zoom INSIDE the screen: scale the image(s) around a focal point */
function innerZoom(el, s, fx, fy) {
  el.querySelectorAll('img').forEach((im) => css(im, { transform: `scale(${s})`, transformOrigin: `${fx * 100}% ${fy * 100}%` }));
}

/* ---------- big S ---------- */
const GLYPHS = {"S": {"d": "M0 493L118 493Q122 536 145.5 566.5Q169 597 207.5 613.5Q246 630 294 630L294 630Q364 630 407.5 603Q451 576 451 527L451 527Q451 493 427 474Q403 455 363.5 444Q324 433 277 423.5Q230 414 182.5 401.5Q135 389 95.5 366.5Q56 344 32 305.5Q8 267 8 206L8 206Q8 148 42.5 101Q77 54 139 27Q201 0 284 0L284 0Q360 0 421.5 30.5Q483 61 519 114.5Q555 168 555 238L555 238L438 238Q434 173 395.5 137.5Q357 102 279 102L279 102Q202 102 162 130.5Q122 159 122 206L122 206Q122 242 146 262.5Q170 283 210 295Q250 307 297 315.5Q344 324 391 336Q438 348 478 370Q518 392 542 429.5Q566 467 566 527L566 527Q566 624 492.5 678Q419 732 288 732L288 732Q207 732 142.5 700.5Q78 669 40.5 615Q3 561 0 493L0 493Z", "w": 566, "h": 732}};
let sLen = 3000;
Promise.resolve(GLYPHS).then((g) => {
  const S = g.S, sc = 560 / S.h;
  const tr = `translate(${960 - (S.w * sc) / 2} ${520 - (S.h * sc) / 2}) scale(${sc})`;
  for (const id of ['sStroke', 'sFill']) { $(id).setAttribute('d', S.d); $(id).setAttribute('transform', tr); }
  $('sStroke').setAttribute('stroke-width', String(5 / sc));
  sLen = $('sStroke').getTotalLength();
  $('sStroke').style.strokeDasharray = String(sLen);
  window.__glyphReady = true;
  render(cur);
});

/* ---------- chips ---------- */
const CHIPS = ['TTF', 'OTF', 'WOFF', 'WOFF2'];
$('chips').innerHTML = CHIPS.map((c, i) => `<div class="chip" id="chip${i}">${c}</div>`).join('');

function bgFor(t) {
  // spotlight colour drifts with the scene
  let c = '198,242,78', a = 0.16;
  if (t > 18.2 && t < 22.6) {
    const f = seg(t, 18.6, 22.0) * 2;
    c = f < 0.7 ? '198,242,78' : f < 1.4 ? '255,77,166' : '155,108,255';
    a = 0.2;
  }
  if (t < 1.0) a *= seg(t, 0, 1.0);
  return `radial-gradient(1200px 700px at 50% 62%, rgba(${c},${a}) 0%, rgba(${c},${a * 0.25}) 40%, rgba(0,0,0,0) 70%), #000`;
}

let cur = 0;
function render(t) {
  cur = t;
  $('bg').style.background = bgFor(t);

  /* S1 — intro (0 – 3.5) */
  const smO = win(t, 0.25, 1.7, 0.6, 0.5);
  css($('intro-sm'), { opacity: String(smO), transform: `translateY(${(1 - eOut(seg(t, 0.25, 1.2))) * 20}px)`, filter: `blur(${(1 - smO) * 8}px)`, display: smO > 0 ? '' : 'none' });
  const sDraw = eInOut(seg(t, 1.2, 2.5));
  const sFill = eOut(seg(t, 2.15, 2.8));
  const sOut = eIn(seg(t, 3.0, 3.55));
  $('sStroke').style.strokeDashoffset = String(sLen * (1 - sDraw));
  $('sStroke').style.opacity = String((1 - sFill * 0.6) * (sDraw > 0 ? 1 : 0));
  $('sFill').style.opacity = String(sFill);
  css($('bigS'), {
    opacity: String((t < 3.6 ? 1 : 0) * (1 - sOut)),
    transform: `scale(${lerp(0.92, 1, eOut(seg(t, 1.2, 3.0))) * (1 + sOut * 5)})`, transformOrigin: '960px 520px',
    display: t < 3.6 ? '' : 'none',
  });
  const nameO = win(t, 2.45, 3.25, 0.5, 0.35);
  css($('intro-name'), { opacity: String(nameO), transform: `translateY(${(1 - eOut(seg(t, 2.45, 3.0))) * 30}px)`, filter: `blur(${(1 - nameO) * 10}px)`, display: nameO > 0 ? '' : 'none' });

  /* S2 + S3 — single glyph editor (3.4 – 11.1) */
  headline('h2', t, 3.55, 7.2);
  headline('h3', t, 7.55, 10.9);
  {
    const inP = eOut(seg(t, 3.75, 5.3));
    const outP = eIn(seg(t, 10.75, 11.2));
    const zoomP = eInOut(seg(t, 7.4, 9.4));
    const drift = seg(t, 5.3, 7.4);
    place($('scrA'), {
      y: lerp(1000, SY, inP),
      rx: lerp(38, 0, inP), s: lerp(0.86, 1, inP) * (1 + drift * 0.03) * (1 - outP * 0.08),
      o: (t > 3.7 ? 1 : 0) * (1 - outP), blur: outP * 14, oy: 30,
    });
    $('scrA2').style.opacity = String(eInOut(seg(t, 6.3, 6.9)));
    innerZoom($('scrA'), lerp(1, 2.35, zoomP) + seg(t, 9.4, 11.1) * 0.12, 0.447, 0.57);
  }

  /* S4 — multi glyph (11.0 – 14.7) */
  headline('h4', t, 11.15, 14.45);
  {
    const inP = eOut(seg(t, 11.0, 11.9));
    const outP = eIn(seg(t, 14.3, 14.75));
    place($('scrB'), { s: lerp(1.12, 1, inP) * (1 - outP * 0.06), o: (t > 10.95 ? inP : 0) * (1 - outP), blur: (1 - inP) * 20 + outP * 14, ry: lerp(-6, 4, seg(t, 11, 14.7)) });
    innerZoom($('scrB'), lerp(2.6, 1.15, eInOut(seg(t, 11.0, 14.2))), 0.5, 0.42);
  }

  /* S5 — test lab (14.6 – 18.3) */
  headline('h5', t, 14.75, 18.05);
  {
    const inP = eOut(seg(t, 14.6, 15.8));
    const outP = eIn(seg(t, 17.85, 18.3));
    place($('scrC'), { x: lerp(1500, 960, inP), ry: lerp(-32, 0, inP), s: 1 - outP * 0.08, o: (t > 14.55 ? 1 : 0) * Math.min(1, inP * 2) * (1 - outP), blur: outP * 14 });
    innerZoom($('scrC'), lerp(1, 1.55, eInOut(seg(t, 15.9, 17.9))), 0.3, 0.42);
  }

  /* S6 — three studios carousel (18.2 – 22.7) */
  headline('h6', t, 18.35, 22.4);
  {
    const appear = eOut(seg(t, 18.3, 19.4));
    const gone = eIn(seg(t, 22.2, 22.7));
    // focus: 0 (Font) → 1 (Design) → 2 (Motion)
    const f = eInOut(seg(t, 19.7, 20.4)) + eInOut(seg(t, 20.9, 21.6));
    for (let i = 0; i < 3; i++) {
      const d = i - f; // distance from focus
      const ad = Math.abs(d);
      place($('card' + i), {
        x: 960 + d * 820 * appear, y: 640, w: 1100,
        tz: -ad * 520, ry: -d * 34, s: (1 - gone * 0.1) * lerp(0.7, 1, appear),
        o: (t > 18.25 ? appear : 0) * (1 - gone) * clamp(1.6 - ad * 0.55),
      });
      const lab = $('lab' + i);
      const lo = (t > 18.25 ? appear : 0) * (1 - gone) * clamp(1 - ad * 1.4);
      css(lab, { left: 960 - 200 + d * 820 + 'px', top: '1000px', opacity: String(lo), transform: `translateY(${(1 - lo) * 20}px)`, display: lo > 0 ? '' : 'none' });
    }
  }

  /* S7 — iPad (22.6 – 25.8) */
  headline('h7', t, 22.75, 25.55);
  {
    const inP = eOut(seg(t, 22.6, 24.0));
    const outP = eIn(seg(t, 25.35, 25.8));
    const W = 1180, H = 820, k = 1.0;
    const el = $('ipad');
    css(el, {
      width: W * k + 'px', height: H * k + 'px', left: 960 - (W * k) / 2 - 26 + 'px', top: 660 - (H * k) / 2 - 26 + 'px',
      transform: `perspective(2400px) rotateX(${lerp(28, 6, inP)}deg) rotateZ(${lerp(-8, 0, inP)}deg) scale(${lerp(0.62, 0.74, inP) * (1 - outP * 0.08)}) translateY(${(1 - inP) * 200}px)`,
      opacity: String((t > 22.55 ? Math.min(1, inP * 1.6) : 0) * (1 - outP)), filter: outP ? `blur(${outP * 14}px)` : 'none',
      display: t > 22.55 && t < 25.85 ? '' : 'none',
    });
    // pulse ring on the floating tablet pad (bottom-left of canvas)
    const rp = seg(t, 24.0, 25.4);
    const pulse = (rp * 2.2) % 1;
    const r = 120 + pulse * 120;
    css($('ipadRing'), { width: r + 'px', height: r + 'px', left: 241 - r / 2 + 'px', top: 693 - r / 2 + 'px', opacity: String(rp > 0 ? (1 - pulse) * 0.9 : 0) });
  }

  /* S8 — export (25.7 – 28.4) */
  headline('h8', t, 25.85, 28.2);
  {
    const inP = eOut(seg(t, 25.7, 26.8));
    const outP = eIn(seg(t, 28.0, 28.45));
    place($('scrE'), { y: 610, w: 1200, s: lerp(0.9, 1, inP) * (1 - outP * 0.08), o: (t > 25.65 ? inP : 0) * (1 - outP), blur: (1 - inP) * 16 + outP * 14 });
    innerZoom($('scrE'), lerp(1, 1.18, seg(t, 25.7, 28.4)), 0.5, 0.45);
    CHIPS.forEach((c, i) => {
      const p = eBack(seg(t, 26.6 + i * 0.13, 27.2 + i * 0.13));
      const xs = [600, 790, 1000, 1240][i];
      const el = $('chip' + i);
      css(el, { left: xs + 'px', top: '960px', opacity: String(clamp(p) * (1 - outP)), transform: `translateY(${(1 - p) * 60}px) scale(${0.6 + 0.4 * p})`, display: t > 26.5 && t < 28.5 ? '' : 'none',
        background: ['#c6f24e', '#d9ff7a', '#9fe870', '#7fd13b'][i] });
    });
  }

  /* S9 — end card (28.3 – 30) */
  {
    const p = eOut(seg(t, 28.35, 29.2));
    const show = t > 28.3;
    $('end').style.display = show ? '' : 'none';
    css($('endIcon'), { opacity: String(p), transform: `scale(${lerp(0.6, 1, eBack(seg(t, 28.35, 29.1)))})`, filter: `blur(${(1 - p) * 12}px) drop-shadow(0 20px 60px rgba(198,242,78,.35))` });
    const p2 = eOut(seg(t, 28.6, 29.4));
    css($('endWord'), { opacity: String(p2), transform: `translateY(${(1 - p2) * 30}px)` });
    const p3 = eOut(seg(t, 28.85, 29.6));
    css($('endTag'), { opacity: String(p3), transform: `translateY(${(1 - p3) * 30}px)`, filter: `blur(${(1 - p3) * 10}px)` });
    const p4 = eOut(seg(t, 29.1, 29.8));
    css($('endSub'), { opacity: String(p4) });
  }
  $('fade').style.opacity = String(seg(t, 29.75, 30) * 0.0);
  $('tc').textContent = t.toFixed(2);
}

/* ---------- preview player / render hooks ---------- */
const params = new URLSearchParams(location.search);
const stage = $('stage');
function fit() {
  if (document.body.classList.contains('render')) return;
  const s = Math.min(innerWidth / 1920, (innerHeight - 50) / 1080);
  stage.style.transform = `scale(${s})`;
  stage.style.position = 'absolute';
  stage.style.left = (innerWidth - 1920 * s) / 2 + 'px';
  stage.style.top = (innerHeight - 50 - 1080 * s) / 2 + 'px';
}
if (params.get('render') === '1') document.body.classList.add('render');
addEventListener('resize', fit); fit();
window.__render = (t) => new Promise((res) => { render(t); requestAnimationFrame(() => requestAnimationFrame(res)); });
window.__prewarm = async () => { for (let t = 0; t <= DUR; t += 0.5) await window.__render(t); };
window.__ready = Promise.all([...document.images].map((im) => (im.decode ? im.decode().catch(() => {}) : null)));

let playing = params.get('render') !== '1', t0 = performance.now(), base = 0;
$('play').onclick = () => { playing = !playing; t0 = performance.now(); base = cur; if (playing) loop(); };
$('scrub').oninput = (e) => { base = +e.target.value; t0 = performance.now(); render(base); };
function loop() {
  if (!playing) return;
  let t = base + (performance.now() - t0) / 1000;
  if (t > DUR) { base = 0; t0 = performance.now(); t = 0; }
  render(t); $('scrub').value = t;
  requestAnimationFrame(loop);
}
render(0);
